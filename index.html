<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --grid: #1f2937;
        --snake: #34d399;
        --snake-head: #10b981;
        --food: #f87171;
        --text: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020617, #111827 40%, #0f172a);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-wrap {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .score {
        font-size: 1.15rem;
      }

      canvas {
        display: block;
        width: min(72vw, 420px);
        height: auto;
        background: var(--bg);
        border: 2px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 14px;
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 10px 18px;
        cursor: pointer;
        transition: transform 0.12s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div class="topbar">
        <span>贪吃蛇</span>
        <span class="score">分数: <span id="score">0</span></span>
      </div>
      <canvas id="game" width="400" height="400"></canvas>
      <div class="controls">
        <button id="restartBtn">重新开始</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const restartBtn = document.getElementById('restartBtn');

      const gridSize = 20;
      const tileCount = canvas.width / gridSize;
      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let loopId;
      let speed;

      function initGame() {
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        speed = 140;
        scoreEl.textContent = score;
        placeFood();
        clearInterval(loopId);
        loopId = setInterval(gameLoop, speed);
      }

      function placeFood() {
        let x;
        let y;
        do {
          x = Math.floor(Math.random() * tileCount);
          y = Math.floor(Math.random() * tileCount);
        } while (snake.some(segment => segment.x === x && segment.y === y));
        food = { x, y };
      }

      function gameLoop() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        if (
          head.x < 0 ||
          head.x >= tileCount ||
          head.y < 0 ||
          head.y >= tileCount ||
          snake.some(segment => segment.x === head.x && segment.y === head.y)
        ) {
          clearInterval(loopId);
          alert('游戏结束！');
          return;
        }

        snake.unshift(head);

        const ateFood = head.x === food.x && head.y === food.y;
        if (ateFood) {
          score += 10;
          scoreEl.textContent = score;
          if (score % 50 === 0) {
            speed = Math.max(60, speed - 10);
            clearInterval(loopId);
            loopId = setInterval(gameLoop, speed);
          }
          placeFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let x = 0; x < tileCount; x++) {
          for (let y = 0; y < tileCount; y++) {
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
            ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
          }
        }

        snake.forEach((segment, index) => {
          ctx.fillStyle = index === 0 ? '#10b981' : '#34d399';
          ctx.fillRect(
            segment.x * gridSize + 1,
            segment.y * gridSize + 1,
            gridSize - 2,
            gridSize - 2
          );
        });

        ctx.fillStyle = '#f87171';
        ctx.fillRect(
          food.x * gridSize + 3,
          food.y * gridSize + 3,
          gridSize - 6,
          gridSize - 6
        );
      }

      document.addEventListener('keydown', event => {
        const keyMap = {
          ArrowUp: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 },
          w: { x: 0, y: -1 },
          s: { x: 0, y: 1 },
          a: { x: -1, y: 0 },
          d: { x: 1, y: 0 }
        };

        const newDir = keyMap[event.key];
        if (!newDir) return;

        const isOpposite =
          newDir.x === -direction.x && newDir.y === -direction.y;
        if (!isOpposite) {
          nextDirection = newDir;
        }
      });

      restartBtn.addEventListener('click', () => {
        initGame();
        draw();
      });

      initGame();
      draw();
    </script>
  </body>
</html>
